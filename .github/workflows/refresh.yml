name: Bullendaten aktualisieren

on:
  schedule:
    # Am 1. jedes Monats, 06:00 UTC (Puffer für die ~quartalsweisen
    # Zuchtwertschätzungen bei WWS/RBW/Prismagen/CRI)
    - cron: "0 6 1 * *"
  workflow_dispatch: {}  # manueller "Run workflow"-Knopf im Actions-Tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Abhängigkeiten installieren
        run: pip install beautifulsoup4 playwright

      - name: Chromium für Playwright installieren
        run: python -m playwright install --with-deps chromium

      # refresh.py holt alle 5 Quellen, prüft jedes Ergebnis auf
      # Plausibilität und schreibt nur geprüfte Daten. Kaputte Quellen
      # behalten ihren alten Stand. Exit-Code 1, wenn etwas kaputt ist -
      # dieser Schritt wird trotzdem nicht abgebrochen, damit die heilen
      # Quellen noch committet werden.
      - name: Alle Kataloge abrufen und prüfen
        id: refresh
        continue-on-error: true
        run: python scraper/refresh.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Bullendaten-Abruf $(date -u +%Y-%m-%d)"
            git push
          fi

      # Lässt den Lauf rot werden, wenn eine Quelle kaputt war.
      # GitHub schickt dem Repo-Besitzer dann automatisch eine E-Mail.
      - name: Bei kaputter Quelle Alarm schlagen
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Mindestens eine Bullen-Quelle konnte nicht abgerufen werden."
          echo "Details stehen im Schritt 'Alle Kataloge abrufen und prüfen'"
          echo "und in docs/data/status.json (wird auch in der Web-App angezeigt)."
          exit 1
