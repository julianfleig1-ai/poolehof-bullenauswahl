name: Diagnose WWS (temporär)
on: workflow_dispatch
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Runner-IP
        shell: bash
        run: curl -s --max-time 15 https://ipinfo.io/json | grep -E '"(ip|org|country)"' || true
      - name: WWS erreichbar?
        shell: bash
        run: curl -sS -o /dev/null -w "WWS ${{ matrix.os }}: HTTP %{http_code} in %{time_total}s\n" -A "Mozilla/5.0" --max-time 25 https://www.wws-bullen.de/bullenangebot || echo "WWS ${{ matrix.os }}: BLOCKIERT exit $?"
