<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poolehof – GitHub-Speicher einrichten</title>
<style>
  :root{--bg:#EFEEE6;--karte:#fff;--text:#1F2A3C;--grau:#5B6472;--gruen:#3F7059;--rot:#b3261e}
  body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,"Segoe UI",Arial,sans-serif}
  main{max-width:620px;margin:32px auto;padding:0 16px}
  .karte{background:var(--karte);border-radius:12px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h1{font-size:24px;margin:0 0 6px} p{margin:6px 0 14px;color:var(--grau)}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input{width:100%;box-sizing:border-box;font-size:18px;padding:10px 12px;border:1px solid #c7c2b2;border-radius:8px}
  button{margin-top:18px;font-size:18px;padding:12px 18px;border:0;border-radius:8px;background:var(--gruen);color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  #meldung{margin-top:16px;white-space:pre-line} .ok{color:var(--gruen);font-weight:600} .fehler{color:var(--rot);font-weight:600}
  small{color:var(--grau)}
</style>
</head>
<body>
<main><div class="karte">
  <h1>🐄 GitHub-Speicher einrichten</h1>
  <p>Läuft nur hier auf deinem Mac. Der Schlüssel geht nur an GitHub (zum Prüfen) und wird dann mit deinem neuen Hof-Passwort verschlüsselt. Nichts davon wird angezeigt oder an Claude geschickt.</p>
  <form id="f">
    <label for="token">GitHub-Schlüssel <small>(beginnt mit github_pat_…)</small></label>
    <input id="token" type="password" autocomplete="off" required>
    <label for="pw1">Neues Hof-Passwort <small>(mind. 12 Zeichen, kein Geburtsdatum, keine Telefonnummer)</small></label>
    <input id="pw1" type="password" autocomplete="new-password" required>
    <label for="pw2">Neues Hof-Passwort nochmal</label>
    <input id="pw2" type="password" autocomplete="new-password" required>
    <button id="los" type="submit">Prüfen und verschlüsseln</button>
  </form>
  <div id="meldung"></div>
</div></main>
<script>
// Muss genau so rechnen wie die App (docs/index.html: HS_SALZ, hsZugangAusPasswort)
const HS_SALZ = "poolehof-hofspeicher-v1";
const REPO = "julianfleig1-ai/poolehof-daten";
const $ = id => document.getElementById(id);
const b64 = buf => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const meld = (t, art) => { $("meldung").className = art || ""; $("meldung").textContent = t; };

async function aesSchluessel(pw){
  const enc = new TextEncoder();
  const basis = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: enc.encode(HS_SALZ + ":aes"), iterations: 600000, hash: "SHA-256"},
    basis, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function gh(token, pfad, opt = {}){
  const r = await fetch("https://api.github.com" + pfad, {...opt, headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.headers || {})}});
  let j = null; try { j = await r.json(); } catch(e) {}
  return {status: r.status, j};
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const token = $("token").value.trim(), pw = $("pw1").value;
  if (!/^github_pat_[A-Za-z0-9_]{20,}$/.test(token)) return meld("Das sieht nicht wie ein GitHub-Schlüssel aus (er beginnt mit github_pat_).", "fehler");
  if (pw !== $("pw2").value) return meld("Die beiden Passwörter sind nicht gleich.", "fehler");
  if (pw.length < 12) return meld("Das Passwort braucht mindestens 12 Zeichen.", "fehler");
  if (/^(\d)\1+$/.test(pw) || "012345678901234567890".includes(pw) || /^(19|20)\d{2}[01]\d[0-3]\d/.test(pw) || /^[0-3]\d[01]\d(19|20)\d{2}/.test(pw))
    return meld("Bitte kein einfaches Muster und kein Datum als Passwort.", "fehler");
  $("los").disabled = true;
  try {
    meld("1/3 Prüfe den Schlüssel bei GitHub …");
    const repo = await gh(token, "/repos/" + REPO);
    if (repo.status === 401) throw new Error("GitHub kennt diesen Schlüssel nicht – bitte nochmal kopieren.");
    if (repo.status === 404) throw new Error("Der Schlüssel hat keinen Zugriff auf „poolehof-daten“ – bei „Repository access“ das Fach auswählen.");
    if (repo.status !== 200) throw new Error("GitHub antwortet nicht wie erwartet (" + repo.status + ").");
    if (!repo.j.private) throw new Error("Achtung: Das Fach ist nicht privat – abgebrochen.");

    meld("2/3 Teste das Speichern …");
    const pfad = "/repos/" + REPO + "/contents/einrichtung.json";
    const alt = await gh(token, pfad);
    const inhalt = btoa(JSON.stringify({eingerichtet: new Date().toISOString(), hinweis: "Test, ob die App hier speichern darf"}));
    const put = await gh(token, pfad, {method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: "Einrichtung: Speichertest", content: inhalt, ...(alt.status === 200 ? {sha: alt.j.sha} : {})})});
    if (put.status === 403 || put.status === 404) throw new Error("Der Schlüssel darf nur lesen – bei „Contents“ bitte „Read and write“ einstellen und einen neuen Schlüssel erstellen.");
    if (put.status !== 200 && put.status !== 201) throw new Error("Speichertest fehlgeschlagen (" + put.status + ").");

    meld("3/3 Verschlüssele mit deinem Hof-Passwort (dauert ein paar Sekunden) …");
    const key = await aesSchluessel(pw);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify({token, repo: REPO, erstellt: new Date().toISOString()})));
    const datei = {art: "poolehof-github-zugang", v: 1, repo: REPO, verfahren: "v2", iv: b64(iv), daten: b64(ct), erstellt: new Date().toISOString()};
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(datei, null, 1)], {type: "application/json"}));
    a.download = "poolehof-github-zugang.json";
    document.body.appendChild(a); a.click(); a.remove();
    $("token").value = ""; $("pw1").value = ""; $("pw2").value = "";
    meld("✓ Fertig! Schlüssel funktioniert (lesen und speichern) und ist verschlüsselt.\nDie Datei „poolehof-github-zugang.json“ liegt in deinen Downloads – sag Claude Bescheid.\nDas GitHub-Fenster mit dem Schlüssel kannst du jetzt schließen. Merk dir das neue Hof-Passwort gut!", "ok");
  } catch(err) {
    meld(err.message, "fehler");
    $("los").disabled = false;
  }
});
</script>
</body>
</html>
